# Publie le site sur GitHub Pages à chaque envoi sur la branche main.
# Adresse : https://delfaha.github.io/farhandel-agency/ (VITE_SITE_URL est défini dans .env)
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sitemap avec l'adresse GitHub Pages
        run: npm run sitemap
      - name: Build (sous-dossier /farhandel-agency/)
        run: npm run build
        env:
          BASE_PATH: /farhandel-agency/
      # Application monopage : GitHub Pages sert 404.html pour les URL profondes (ex. /destinations).
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
